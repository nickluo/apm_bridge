custom_link_bridge:
  ros__parameters:
    gravity_const: 9.8065
    mass: 1.067

    lipo_cells: 6   # V_ref = cells*3.7 (6S 22.20 V), 欠压下限 = cells*2.0 (6S 12.0 V)
    # 整包容量 (mAh)。/mavros/battery 的 charge/percentage 与 OSD 用量条依据，
    # 按实际电池修改；0 = 未知 (percentage 发布 NaN)。
    battery:
      capacity_mah: 1800.0
    # fpv_test.md §4: 步骤 3 电压/电流补偿 与 步骤 1 气压/温度折算
    voltage_compensation: true
    baro_compensation: true
    voltage_lpf_hz: 3.0   # 母线电压/电流一阶低通截止频率, 文档要求 2~5 Hz

    channel_trigger: 9 # CH10 / AUX6 zero-based MISSION trigger channel

    # fpv_test.md 推力模型 (标准状态 V_ref/0°C/101325 Pa, u = DShot 占空比, 总推力 N):
    #   F_std(u) = a3*u^3 + a2*u^2 + a1*u
    # 需按 fpv_test.md §2 台架实验重新标定 (thrust_test_node), 结果 YAML 中的整段粘贴到此。
    # a3..a1 全零 = 未标定: 节点拒绝 /fpv/control_command 力指令, 只允许 raw 油门。
    # §4 步骤 4 的怠速下限 u_idle 不是参数: 链路建立后由飞控 CLI "get motor_idle" 读取
    # (550 = 5.5% 占空比, 即集体油门 0), 读到之前同样拒绝力指令。
    # motor_parameters:
    #   a3: 0.0
    #   a2: 0.0
    #   a1: 0.0
    #   r_eq: 0.0           # 全系统等效内阻 (Ω), 标定得出; 0 = 一阶电压补偿
    #   k_i: 0.0            # 电流模型 I_std(F) = ((k_i3*F + k_i2)*F + k_i)*F 的线性项,
    #   k_i2: 0.0           # k_i2/k_i3 为二次/三次项 (2026-11-12; A/N, A/N^2, A/N^3,
    #   k_i3: 0.0           # 标定得出)。三项全 0 = 一阶电压补偿; 缺省即线性 (旧文件兼容)

    # E_X_40 Bluejay with HQ70403
    motor_parameters:
      a3: -167.024226
      a2: 285.094924
      a1: 1.46489535
      r_eq: 0.0347738198
      k_i: 0.732982933
      k_i2: 0.0121135304
      k_i3: 4.39274794e-06
      # 动力系统最大油门保护 (集体油门域 0.0-1.0, u_idle 对应 0, 1 = 满占空比):
      # 节点在输出端对力通道 (推力反解) 与 raw 通道统一限幅, 保护电机/ESC/电池。
      # 1.0 = 不限制; 0.0 = 电机钉死怠速地板 (仅数据链路运转, 会有告警)。
      # 与推力曲线标定无关, 只改此值即可; 上限对应推力查 F_std(u_idle+(1-u_idle)*limit)。
      throttle_limit: 0.6

    link:
      # serial: 真机串口; tcp: SITL 仿真 (UART3 = tcp/5763)
      transport: "serial"
      serial_port: "/dev/ttyS8"
      baudrate: 921600
      tcp_host: "127.0.0.1"
      tcp_port: 5763
      control_rate: 100.0   # 缓存推送和 0x20 上行频率 (Hz)，周期须小于 FC 看门狗 (默认 50ms)
      rate_limit_dps: 0.0   # 客户端角速度限幅 (deg/s, 0=不限)；固件侧另有 custom_link_rate_limit_dps
      angle_limit_deg: 0.0  # 客户端角度模式 roll/pitch 限幅 (deg, 0=不限)；固件侧兜底为 pid profile angle_limit (默认 60)
      # ---- raw 通道集体油门成形: EMA 平滑 + 线性斜坡加/减速限制 ----
      # 阶跃油门在低转速下定子电流缺乏反电动势抑制; 限速给电机转子/螺旋桨
      # 留出建立转速与反电动势的时间, 抑制大电流冲击与母线电压跌落, 减速
      # 方向同时抑制占空比骤降的再生回馈电流尖峰。只作用于 ~/control_command_raw
      # 的集体油门 (力通道与 MOTOR_DIRECT 台架标定直通, 不成形)。0 = 关闭。
      throttle_ramp_up_s: 1.0    # 0→100% 满量程加速斜坡时间 (s)。1.0 @100Hz 即每 10ms 最多 +1% 油门
      throttle_ramp_down_s: 0.5  # 100%→0 减速斜坡时间 (s), 缺省比加速快一倍 (转子自然减速更快)
      throttle_ema_window: 5    # EMA 平滑窗口 (控制周期样本数, α=2/(N+1)); 10@100Hz 时间常数约 45ms; <2 不平滑
      sync_rate: 1.0        # 四时间戳对时频率
      diag_rate: 0.2        # 链路诊断日志频率

    imu:
      # 0x10 原生航空制单位 (gyro 0.1 deg/s, acc 1mg)，无需标定缩放。
      frame_id: "base_link"
      # REP-145 协方差参数，留 0 表示“未知”。
      orientation_stddev: 0.0
      angular_velocity_stddev: 0.0
      linear_acceleration_stddev: 0.0

    rc:
      control_timeout: 0.5

    cli:
      # /fpv/cli 服务与连接触发动作的响应超时 (s)。
      timeout_s: 3.0
      # 每次与 FC 链路建立成功后，自动经 CLI 通道 (0x24 bind_rx) 让遥控
      # 接收机进入配对模式。FC 成功应答 "binding..." 并记 INFO 日志；
      # 被拒/失败记 WARN。换新遥控器/接收机配对时临时打开，平时保持
      # false 以免每次上电都打断正常接收。
      bind_rx_on_connect: false

    landed:
      airborne_altitude: 0.5
      landing_altitude: 0.2
      takeoff_confirm_time: 0.5
      landing_confirm_time: 1.0

    # 留空使用固定俯仰角的捷联相机；非空使用 XFrobot 串口云台。
    gimbal_port: "/dev/ttyS10"

    gimbal:
      mission_on_ground: true # 在地面时是否允许执行任务
      # ---- 基座安装旋转 (行主序 3x3, FRD 体坐标系; 默认单位阵 = 基座与机身对齐) ----
      # 定义"编码器零位时云台基座相对机身"的固定安装角: camera_to_body =
      # mount * (关节链)。只作用于位姿融合 (/fpv/gimbal, 编码器 -> 相机姿态) 与
      # AirSim 运动学; AIM/HORIZON 伺服 (cam_angle 绝对俯仰域) 与行程门控 (编码器域)
      # 均与安装无关, 不做换算。
      # 当前真机立装定案 (2026-11-13 三轮台架验证): 编码器零位相机朝机身上方;
      # 对准 ~80° 上仰目标时融合光轴 asin(2(x·z - w·y)) 读 +73° (残差 ~7° 为
      # 编码器-IMU 域偏置, 需要时用 pitch_aim 吸收)。回中位相机朝上 = 快速自检锚点。
      # 注意: ①元素必须写浮点字面量 (整数会被 YAML 解析成 integer_array, 与
      # double 声明冲突, 启动即崩); ②校验正交 + det=+1, 否则节点拒绝启动。
      mount_rotation: [ 0.0, 0.0, -1.0,
                        0.0, 1.0, 0.0,
                        1.0, 0.0, 0.0]
      # ---- 启动回中 (机械零点) ----
      # 首次连接成功后先触发 go_zero 回中 (锁定+零速等待固件动作), 各轴编码器
      # 进入 home_tolerance_deg 容差或 home_timeout_s 超时后才进入 AIM 等模式;
      # /fpv/gimbal_mode 期间发布 "HOMING"。每个节点生命周期只回中一次。
      home_on_connect: true
      # home_timeout_s: 10.0     # 回中完成判定超时 (s), 超时放行并告警
      # home_tolerance_deg: 2.0  # 各轴编码器近零容差 (deg)
      # 共用俯仰角 (deg)：捷联仍为机身固定角 (FLU 正值低头)。
      # 真机/AirSim 增稳云台正值抬头，仅 HORIZON 使用；MISSION 以画面中心为目标。
      pitch_hold: 0.0
      # AIM 相对机身俯仰期望为 -90 + pitch_aim (deg, ROS FLU 域: X 轴向 +Z 旋转
      # 为负, 向上 = -90°, 即对齐 ROS FLU +Z)。正值使瞄准线自 +Z 向鼻端回摆;
      # 10.0 => -80° (上仰 80°)。
      pitch_aim: 10.0
      tracking_gain: 2.0
      tracking_max_rate: 600.0 # deg/s，每轴统一角速度上限。
      tracking_max_accel: 900.0 # deg/s^2.
      tracking_filter_tau: 0.12 # seconds.
      los_timeout: 0.5 # seconds.
      # 云台机型: C20S (单轴) / C40D (卧式两轴) / C200T (三轴)，决定参与控制的轴。
      model: "C20S"
      # ---- 机械行程限位 (编码器/关节域, 抬头正; 由图纸实测) ----
      # 仅作编码器角度门控与 AIM 目标钳制, 与姿态角保持值无关。
      # roll_travel_min: -50.0    # deg
      # roll_travel_max: 50.0
      pitch_travel_min: -110.0
      pitch_travel_max: 110.0
      # yaw_travel_min: 0.0
      # yaw_travel_max: 0.0
      # ---- MISSION 相对机身俯仰窗口 (deg, 基准同 pitch_aim: ROS FLU +Z 向上 = -90°) ----
      # 跟踪中关节角限制在 [-90+pitch_mission_min, -90+pitch_mission_max] 内,
      # 超界只拦朝外方向 (允许回界)。默认不设 = 机械行程全范围; 须与机械行程相交。
      # 例: min=-20/max=70 => 关节角 ∈ [-110°, -20°] (上视为主, 略过顶)。
      pitch_mission_min: -20.0
      pitch_mission_max: 70.0
      # pitch_roll_speed_scale: 12.0
      # yaw_speed_scale: 10.0
      # ---- C-20S HORIZON 单轴俯仰逻辑 ----
      # 锁定+角度控制保持期望俯仰角 (0=水平);
      # |IMU滚转角| > roll_hold_enter (大坡度/倒飞): 锁定+零速保持当前俯仰角,
      # 回落到 roll_hold_exit 以下恢复角度控制 (exit 设小于 enter 可构成迟滞)。
      roll_hold_enter: 75.0
      roll_hold_exit: 70.0
      # 载机惯导数据融合 (提升机动飞行时的云台角度精度)。
      # 加速度/偏航的符号约定尚未实机验证，验证前保持 false。
      send_uav_data: false
