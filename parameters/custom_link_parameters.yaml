custom_link_bridge:
  ros__parameters:
    gravity_const: 9.801
    mass: 2.0

    lipo_cells: 6
    # 整包容量 (mAh)。/mavros/battery 的 charge/percentage 与 OSD 用量条依据，
    # 按实际电池修改；0 = 未知 (percentage 发布 NaN)。
    battery:
      capacity_mah: 13000.0
    voltage_compensation: true
    baro_compensation: true

    channel_trigger: 6

    motor_parameters:
      A:  0.0000793607
      B: -0.004194295
      C:  0.104836283
      D: -0.231665421
      n:  4
      spin_k: 0.0

    link:
      # serial: 真机串口; tcp: SITL 仿真 (UART3 = tcp/5763)
      transport: "serial"
      serial_port: "/dev/ttyTHS1"
      baudrate: 921600
      tcp_host: "127.0.0.1"
      tcp_port: 5763
      control_rate: 100.0   # 0x20 上行频率，须 < FC 看门狗 (默认 50ms) 容忍的丢帧
      rate_limit_dps: 0.0   # 客户端角速度限幅 (deg/s, 0=不限)；固件侧另有 custom_link_rate_limit_dps
      sync_rate: 1.0        # 四时间戳对时频率
      diag_rate: 0.2        # 链路诊断日志频率

    imu:
      # 0x10 原生航空制单位 (gyro 0.1 deg/s, acc 1mg)，无需标定缩放。
      frame_id: "base_link"
      # REP-145 协方差参数，留 0 表示“未知”。
      orientation_stddev: 0.0
      angular_velocity_stddev: 0.0
      linear_acceleration_stddev: 0.0

    rc:
      control_timeout: 0.5

    landed:
      airborne_altitude: 0.5

    # 留空则不启用云台线程。
    gimbal_port: ""

    gimbal:
      # 云台机型: C20S (单轴) / C40D (卧式两轴) / C200T (三轴)，决定参与控制的轴。
      # 行程限位默认沿用三轴机现场调参数值，手册正文未给数值 (在图纸)，
      # 换机型后务必按图纸实测并用下列参数覆盖。
      model: "C20S"
      # roll_min: -50.0    # deg
      # roll_max: 50.0
      # pitch_min: -135.0
      # pitch_max: 40.0
      # pitch_roll_speed_scale: 12.0
      # yaw_speed_scale: 10.0
      # max_angle_speed: 150.0
      # ---- C-20S 单轴俯仰逻辑 (其余机型不使用) ----
      # 常态: 锁定+角度控制保持期望俯仰角 (0=水平);
      # |IMU滚转角| > roll_hold_enter (大坡度/倒飞): 锁定+零速保持当前俯仰角,
      # 回落到 roll_hold_exit 以下恢复角度控制 (exit 设小于 enter 可构成迟滞)。
      pitch_hold: 0.0
      roll_hold_enter: 75.0
      roll_hold_exit: 70.0
      # 载机惯导数据融合 (提升机动飞行时的云台角度精度)。
      # 加速度/偏航的符号约定尚未实机验证，验证前保持 false。
      send_uav_data: false
