custom_link_bridge:
  ros__parameters:
    gravity_const: 9.8065
    mass: 1.067

    lipo_cells: 6
    # 整包容量 (mAh)。/mavros/battery 的 charge/percentage 与 OSD 用量条依据，
    # 按实际电池修改；0 = 未知 (percentage 发布 NaN)。
    battery:
      capacity_mah: 1800.0
    voltage_compensation: true
    baro_compensation: true

    channel_trigger: 9 # CH10 / AUX6 zero-based MISSION trigger channel

    # vbat 电压补偿模型 (lyrical 分支台架拟合, 6S 口径, V_ref = 6*3.7 = 22.2V):
    # vbat_a = 0 (默认) 时未启用, 退回线性 volt_max/V 补偿, 行为与旧版一致。
    motor_parameters:
      A:  2.26453885e-06
      B: -0.00026519864
      C:  0.0179075134
      D:  0.0119440187
      n:  1
      # 推力指令上限; 兼作 thrustToForce 反演曲线的拟合域上界 [0, thrust_limit]
      thrust_limit: 0.9
      spin_k: 0.0
      vbat_a: -0.0776732
      vbat_b:  2.7346374

    link:
      # serial: 真机串口; tcp: SITL 仿真 (UART3 = tcp/5763)
      transport: "serial"
      serial_port: "/dev/ttyS8"
      baudrate: 921600
      tcp_host: "127.0.0.1"
      tcp_port: 5763
      control_rate: 100.0   # 缓存推送和 0x20 上行频率 (Hz)，周期须小于 FC 看门狗 (默认 50ms)
      rate_limit_dps: 0.0   # 客户端角速度限幅 (deg/s, 0=不限)；固件侧另有 custom_link_rate_limit_dps
      sync_rate: 1.0        # 四时间戳对时频率
      diag_rate: 0.2        # 链路诊断日志频率

    imu:
      # 0x10 原生航空制单位 (gyro 0.1 deg/s, acc 1mg)，无需标定缩放。
      frame_id: "base_link"
      # REP-145 协方差参数，留 0 表示“未知”。
      orientation_stddev: 0.0
      angular_velocity_stddev: 0.0
      linear_acceleration_stddev: 0.0

    rc:
      control_timeout: 0.5

    cli:
      # /fpv/cli 服务与连接触发动作的响应超时 (s)。
      timeout_s: 3.0
      # 每次与 FC 链路建立成功后，自动经 CLI 通道 (0x24 bind_rx) 让遥控
      # 接收机进入配对模式。FC 成功应答 "binding..." 并记 INFO 日志；
      # 被拒/失败记 WARN。换新遥控器/接收机配对时临时打开，平时保持
      # false 以免每次上电都打断正常接收。
      bind_rx_on_connect: true

    landed:
      airborne_altitude: 0.5
      landing_altitude: 0.2
      takeoff_confirm_time: 0.5
      landing_confirm_time: 1.0

    # 留空使用固定俯仰角的捷联相机；非空使用 XFrobot 串口云台。
    gimbal_port: "/dev/ttyS10"

    gimbal:
      mission_on_ground: true # 在地面时是否允许执行任务
      # 共用俯仰角 (deg)：捷联仍为机身固定角 (FLU 正值低头)。
      # 真机/AirSim 增稳云台正值抬头，仅 HORIZON 使用；MISSION 以画面中心为目标。
      pitch_hold: 0.0
      # AIM 相对机身俯仰期望为 90 + pitch_aim (deg)，对齐 ROS FLU +Z（向上）。
      pitch_aim: -10.0
      tracking_gain: 2.0
      tracking_max_rate: 600.0 # deg/s，每轴统一角速度上限。
      tracking_max_accel: 900.0 # deg/s^2.
      tracking_filter_tau: 0.12 # seconds.
      los_timeout: 0.5 # seconds.
      # 云台机型: C20S (单轴) / C40D (卧式两轴) / C200T (三轴)，决定参与控制的轴。
      model: "C20S"
      # ---- 机械行程限位 (编码器/关节域, 抬头正; 由图纸实测) ----
      # 仅作编码器角度门控与 AIM 目标钳制, 与姿态角保持值无关。
      # roll_travel_min: -50.0    # deg
      # roll_travel_max: 50.0
      pitch_travel_min: -40.0
      pitch_travel_max: 110.0
      # yaw_travel_min: 0.0
      # yaw_travel_max: 0.0
      # ---- MISSION 相对机身俯仰窗口 (deg, 基准同 pitch_aim: FLU +Z 向上 = 90°) ----
      # 跟踪中关节角限制在 [90+pitch_mission_min, 90+pitch_mission_max] 内,
      # 超界只拦朝外方向 (允许回界)。默认不设 = 机械行程全范围; 须与机械行程相交。
      # 例: min=-45/max=10 => 关节角 ∈ [45°, 100°] (上视为主, 略过顶)。
      pitch_mission_min: -70.0
      pitch_mission_max: 20.0
      # pitch_roll_speed_scale: 12.0
      # yaw_speed_scale: 10.0
      # ---- C-20S HORIZON 单轴俯仰逻辑 ----
      # 锁定+角度控制保持期望俯仰角 (0=水平);
      # |IMU滚转角| > roll_hold_enter (大坡度/倒飞): 锁定+零速保持当前俯仰角,
      # 回落到 roll_hold_exit 以下恢复角度控制 (exit 设小于 enter 可构成迟滞)。
      roll_hold_enter: 75.0
      roll_hold_exit: 70.0
      # 载机惯导数据融合 (提升机动飞行时的云台角度精度)。
      # 加速度/偏航的符号约定尚未实机验证，验证前保持 false。
      send_uav_data: false
